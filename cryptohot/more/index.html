(function(){
  try{
    var root=document.documentElement;
    var group=document.querySelector('[role="radiogroup"][aria-label="外观"]');
    if(!group)return;
    var btns=[].slice.call(group.querySelectorAll('button[role="radio"]'));
    if(!btns.length)return;

    // key 从内联初始化脚本里读出来，避免写死（四站共用 aihot-theme，但不依赖这点）
    var key='aihot-theme';
    var scripts=document.querySelectorAll('script:not([src])');
    for(var i=0;i<scripts.length;i++){
      var m=/k='([a-z]+-theme)'/.exec(scripts[i].textContent||'');
      if(m){key=m[1];break;}
    }

    var META={sepia:{color:'#efe4cc',scheme:'light'},ink:{color:'#101419',scheme:'dark'}};
    var THUMB=group.querySelector('span[aria-hidden="true"]');

    function current(){
      var v=root.getAttribute('data-theme');
      return v==='ink'||v==='dark'?'ink':'sepia';
    }

    function apply(t,persist){
      if(t!=='ink'&&t!=='sepia')t='sepia';
      root.setAttribute('data-theme',t);
      root.style.colorScheme=META[t].scheme;

      var metas=document.querySelectorAll('meta[name="theme-color"]');
      for(var i=0;i<metas.length;i++){metas[i].setAttribute('content',META[t].color);}

      var idx=(t==='ink')?1:0;
      for(var j=0;j<btns.length;j++){
        var on=(j===idx);
        btns[j].setAttribute('aria-checked',on?'true':'false');
        btns[j].classList.toggle('text-ink',on);
        btns[j].classList.toggle('text-ink-4',!on);
        btns[j].classList.toggle('hover:text-ink-2',!on);
      }
      if(THUMB)THUMB.style.transform='translateX('+(idx*100)+'%)';

      if(persist){
        try{document.cookie=key+'='+t+'; path=/; max-age=31536000; SameSite=Lax';}catch(e){}
        try{localStorage.setItem(key,t);}catch(e){}
      }
    }

    // 首屏对齐（内联脚本已经设过 data-theme，这里只同步 UI 状态）
    apply(current(),false);

    group.addEventListener('click',function(ev){
      var b=ev.target.closest?ev.target.closest('button[role="radio"]'):null;
      if(!b||!group.contains(b))return;
      var title=b.getAttribute('title')||'';
      apply(title==='报纸'?'sepia':title==='墨'?'ink':'sepia',true);
      ev.preventDefault();
    },false);
  }catch(e){}
})();
</script></body></html>
