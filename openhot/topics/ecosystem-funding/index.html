      var b=ev.target.closest?ev.target.closest('button[role="radio"]'):null;
      if(!b||!group.contains(b))return;
      var title=b.getAttribute('title')||'';
      apply(title==='报纸'?'sepia':title==='墨'?'ink':'sepia',true);
      ev.preventDefault();
    },false);
  }catch(e){}
})();
</script></body></html>
